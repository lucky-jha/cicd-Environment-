name: Enviroment Variable Demo
on:
  push:
    branches:
        - "feature/**"
        - develop
        - main
jobs:
    build-job:
        runs-on: ubuntu-latest
        
        steps:
            - name: checkout reppository
              uses: actions/checkout@v6
            
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build & push to Docker hub
              uses: docker/build-push-action@v4
              with: 
                context: .
                push: true
                tags: |
                 ${{ vars.DOCKERHUB_USERNAME }}//cicd-enviorment:${{ github.sha }}
                 ${{ vars.DOCKERHUB_USERNAME }}//cicd-enviorment:latest

    deploy-dev-job:
        
        name: Deploy to DEVLOPMENT
        if: github.ref == 'develop' #its specify git branch 
        needs: build-job
        runs-on: ubuntu-latest
        environment: dev            #its specify in that branch use dev environment

        steps:
            - name: Display Brach information
              run: |
                echo "Branch Name: ${{ github.ref_name }}"
            
            - name: Display environment Configuration
              run: |
                echo "Application URL : ${{ vars.APP_URL }}"
                echo "Debug Mode : ${{ vars.DEBUG_MODE }}"
            
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Run container
              run: |
                docker run -d \
                -p 5000:5000 \
                --name cicd-enviorment \
                ${{ vars.DOCKERHUB_USERNAME }}/cicd-enviorment:latest

            - name: smoke test
              run: |
                sleep 5
                curl --fail http://localhost:5000/
                curl --fail http://localhost:5000/health

            - name: Deploy container logs
              run: docker logs cicd-enviorment

    deploy-prod-job:

        name: Deploy to PRODUCTION
        if: github.ref == 'main' #its specify git branch
        needs: build-job
        runs-on: ubuntu-latest
        environment: prod            #its specify in that branch use prod environment

        steps:
            - name: Display Brach information
              run: |
                echo "Branch Name: ${{ github.ref_name }}"

            - name: Display environment Configuration
              run: |
                echo "Application URL : ${{ vars.APP_URL }}"
                echo "Debug Mode : ${{ vars.DEBUG_MODE }}"

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Run container
              run: |
                docker run -d \
                -p 5000:5000 \
                --name cicd-enviorment \
                ${{ vars.DOCKERHUB_USERNAME }}/cicd-enviorment:latest

            - name: smoke test
              run: |
                sleep 5
                curl --fail http://localhost:5000/  
                curl --fail http://localhost:5000/health
                
            - name: Deploy container logs
              run: docker logs cicd-enviorment
            